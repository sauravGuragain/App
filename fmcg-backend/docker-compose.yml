services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fmcg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fmcg_secret}
      POSTGRES_DB: ${POSTGRES_DB:-fmcg}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fmcg}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Apply migrations, then serve. (Alembic wiring lands in Phase 3.)
    command: >
      sh -c "alembic upgrade head || true &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
